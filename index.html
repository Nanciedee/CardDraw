<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tirage Cartes Arc & Vib</title>
  <style>
    :root {
      --primary: #4CAF50;
      --bg: #f4f7f6;
      --text: #333;
      --shadow: rgba(0,0,0,0.1);
    }

    body { font-family: 'Segoe UI', Arial, sans-serif; text-align: center; padding: 20px; background: var(--bg); color: var(--text); }
    h1 { color: #2c3e50; margin-bottom: 30px; text-shadow: 1px 1px 2px rgba(0,0,0,0.1); }
    
    .btn-group { margin-bottom: 25px; }
    button { 
      padding: 14px 24px; font-size: 16px; cursor: pointer; margin: 8px; 
      border-radius: 12px; border: none; transition: all 0.2s ease; 
      background: var(--primary); color: white; font-weight: 600;
      box-shadow: 0 4px 6px var(--shadow);
    }
    button:hover { transform: translateY(-2px); box-shadow: 0 6px 12px var(--shadow); filter: brightness(1.1); }
    #reshuffle { background: #95a5a6; }

    .paper { 
        background: white; border-radius: 20px; 
        box-shadow: 0 10px 25px var(--shadow); border: 1px solid #eee;
        animation: slideUp 0.4s ease-out;
    }

    @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

    #displayZone img { width: 100%; max-width: 280px; border-radius: 12px; margin-top: 10px; }

    /* Historique par jour */
    #history { margin: 40px auto; text-align: left; max-width: 600px; }
    .history-day-group { 
        background: #fff; border-radius: 15px; padding: 15px; 
        margin-bottom: 20px; box-shadow: 0 4px 15px var(--shadow);
    }
    .history-date-header { 
        font-weight: bold; color: var(--primary); border-bottom: 2px solid #eee; 
        padding-bottom: 8px; margin-bottom: 10px; font-size: 1.1rem;
    }
    .history-list { list-style: none; padding: 0; margin: 0; }
    .history-item { 
        padding: 10px 0; border-bottom: 1px solid #f9f9f9; 
        display: flex; justify-content: space-between; align-items: center; font-size: 14px;
    }
    .history-item:last-child { border-bottom: none; }
    .time { font-size: 12px; color: #999; background: #f0f0f0; padding: 2px 8px; border-radius: 8px; }
  </style>
</head>
<body>

  <h1>✨ Tirage de Cartes Arc & Vib ✨</h1>

  <div class="btn-group">
    <button id="drawArc">Tirer une carte Arc</button>
    <button id="drawVib">Tirer une carte Vib</button>
    <button id="reshuffle">🔄 Réinitialiser</button>
  </div>

  <div id="displayZone" style="display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; margin-bottom: 30px;">
    <div id="arcSlot" class="paper" style="width: 320px; min-height: 450px; padding: 20px; display: none;">
        <h3 style="color:var(--primary); margin-top:0;">Carte Arc</h3>
        <img id="arcImg" src="">
        <h4 id="arcTitle" style="margin: 15px 0 10px 0;"></h4>
        <p id="arcDesc" style="font-size: 0.85em; text-align: left; white-space: pre-line; line-height: 1.5; background: #fdfdfd; padding: 12px; border-radius: 8px; border-left: 4px solid var(--primary);"></p>
    </div>
    <div id="vibSlot" class="paper" style="width: 320px; min-height: 450px; padding: 20px; display: none;">
        <h3 style="color:var(--primary); margin-top:0;">Carte Vib</h3>
        <img id="vibImg" src="">
        <h4 id="vibTitle" style="margin: 15px 0 10px 0;"></h4>
        <p id="vibDesc" style="font-size: 0.85em; text-align: left; white-space: pre-line; line-height: 1.5; background: #fdfdfd; padding: 12px; border-radius: 8px; border-left: 4px solid #9c27b0;"></p>
    </div>
  </div>

  <div id="history">
    <h3 style="text-align:center; color:#7f8c8d;">📜 Historique des Tirages</h3>
    <div id="historyContainer"></div>
  </div>

  <script>
    // --- (Tableaux de cartes inchangés) ---
    const arcCards = [
      { name: "🛡️ Michaël – Guerrier céleste tribal", image: "arc1.png", description: "🔤 Nom : Mikhaël — “Qui est comme Dieu ?”\n🌈 Fréquence : 528 Hz\n💎 Pierres : Lapis-lazuli, Sodalite, Tourmaline noire\n🌞 Astres : Soleil, Mars\n🪬 Symboles : épée flamboyante, bouclier solaire\n🧭 Rôle : Protecteur des justes" },
      { name: "🌿 Raphaël – Chamane guérisseur végétal", image: "arc2.png", description: "🔤 Nom : Refael — “Dieu guérit”\n🌈 Fréquence : 639 Hz\n💎 Pierres : Malachite, Émeraude, Fluorite verte\n🌠 Astres : Mercure, Vénus\n🪬 Symboles : bâton de soin, temple de jade\n🧭 Rôle : Guérisseur divin" },
      { name: "🌙 Gabriel – Messager d’eau et de lune", image: "arc3.png", description: "🔤 Nom : Gavri’el — “Force de Dieu”\n🌈 Fréquence : 741 Hz\n💎 Pierres : Pierre de lune, Citrine, Cornaline\n🌠 Astres : Lune, Neptune\n🪬 Symboles : harpe lunaire, perles marines\n🧭 Rôle : Messager divin" },
      { name: "🔥 Uriel – Alchimiste du feu cosmique", image: "arc4.png", description: "🔤 Nom : Uriel — “Lumière de Dieu”\n🌈 Fréquence : 852 Hz\n💎 Pierres : Ambre, Pyrite, Hématite\n🌠 Astres : Uranus, Soleil\n🪬 Symboles : sphère incandescente, forge céleste\n🧭 Rôle : Porteur de sagesse divine" },
      { name: "🌸 Chamuel – Gardien du jardin sacré", image: "arc5.png", description: "🔤 Nom : Chamuel — “Celui qui voit Dieu”\n🌈 Fréquence : 639 Hz\n💎 Pierres : Quartz rose, Rhodonite\n🌠 Astres : Vénus, Lune\n🪬 Symboles : cœur rayonnant, colombe\n🧭 Rôle : Amour inconditionnel" },
      { name: "☀️ Jophiel – Oracle solaire", image: "arc6.png", description: "🔤 Nom : Jophiel — “Beauté de Dieu”\n🌈 Fréquence : 963 Hz\n💎 Pierres : Topaze dorée, Kunzite\n🌠 Astres : Jupiter, Soleil\n🪬 Symboles : plume dorée, miroir céleste\n🧭 Rôle : Beauté et inspiration" },
      { name: "🔮 Zadkiel – Prêtre de la flamme violette", image: "arc7.png", description: "🔤 Nom : Zadkiel — “Justice de Dieu”\n🌈 Fréquence : 432 Hz\n💎 Pierres : Améthyste, Sugilite\n🌠 Astres : Saturne, Pluton\n🪬 Symboles : flamme violette, sablier cosmique\n🧭 Rôle : Transmutation et pardon" },
      { name: "🌌 Haniel – Reine lunaire intuitive", image: "arc8.png", description: "🔤 Nom : Haniel — “Grâce de Dieu”\n🌈 Fréquence : 417 Hz\n💎 Pierres : Pierre de lune, Sélénite\n🌠 Astres : Lune, Vénus\n🪬 Symboles : croissant lunaire, miroir d’eau\n🧭 Rôle : Féminité sacrée" },
      { name: "🌀 Raziel – Voyageur interdimensionnel", image: "arc9.png", description: "🔤 Nom : Raziel — “Secret de Dieu”\n🌈 Fréquence : 888 Hz\n💎 Pierres : Cristal de roche, Moldavite\n🌠 Astres : Uranus, Mercure\n🪬 Symboles : livre scellé, spirale dorée\n🧭 Rôle : Mystères et lois universelles" },
      { name: "🕯️ Azraël – Sage funéraire", image: "arc10.png", description: "🔤 Nom : Azraël — “Celui que Dieu aide”\n🌈 Fréquence : 396 Hz\n💎 Pierres : Calcite crème, Rose des sables\n🌠 Astres : Saturne, Pluton\n🪬 Symboles : sablier, plume blanche\n🧭 Rôle : Paix des âmes" },
      { name: "🪘 Sandalphon – Veilleur des racines", image: "arc11.png", description: "🔤 Nom : Sandalphon — “Frère”\n🌈 Fréquence : 285 Hz\n💎 Pierres : Turquoise, Quartz bleu\n🌠 Astres : Terre, Neptune\n🪬 Symboles : tambour cosmique, racines lumineuses\n🧭 Rôle : Ancrage et musique" },
      { name: "✨ Métatron – Maître géomètre", image: "arc12.png", description: "🔤 Nom : Métatron — “Trône de Dieu”\n🌈 Fréquence : 999 Hz\n💎 Pierres : Tourmaline melon, Platine\n🌠 Astres : Pléiades, Sirius\n🪬 Symboles : cube de Métatron, vortex\n🧭 Rôle : Ascension et géométrie divine" }
    ];

    const vibCards = [
      { name: "🛡️ Protection", image: "vib1.png", description: "Fonction : Dissout les intrusions\nFréquence : 417 Hz\nPierres : Obsidienne, Tourmaline noire\nInvocation : \"Par la force de Mars et la sagesse de Saturne, J’appelle la vibration de Protection divine... Ainsi soit-il.\"" },
      { name: "🌿 Guérison", image: "vib2.png", description: "Fonction : Libère les mémoires\nFréquence : 528 Hz\nPierres : Malachite, Fluorite\nInvocation : \"Par la lumière de la Lune et la médecine de Chiron... Ainsi soit-il.\"" },
      { name: "🧭 Guidance", image: "vib3.png", description: "Fonction : Active l’intuition\nFréquence : 852 Hz\nPierres : Labradorite, Lapis lazuli\nInvocation : \"Par la clarté de Mercure et l’éveil d’Uranus... Ainsi soit-il.\"" },
      { name: "💗 Amour", image: "vib4.png", description: "Fonction : Dissout les blocages affectifs\nFréquence : 639 Hz\nPierres : Quartz rose, Rhodonite\nInvocation : \"Par la douceur de Vénus et la tendresse de la Terre... Ainsi soit-il.\"" },
      { name: "🦉 Sagesse", image: "vib5.png", description: "Fonction : Accès aux plans supérieurs\nFréquence : 963 Hz\nPierres : Améthyste, Cristal de roche\nInvocation : \"Par la lumière du Soleil et les eaux de Neptune... Ainsi soit-il.\"" }
    ];

    let drawnArc = [];
    let drawnVib = [];

    function drawCard(deck, drawnArray) {
      if (drawnArray.length === deck.length) drawnArray.length = 0;
      let remaining = deck.map((_, i) => i).filter(i => !drawnArray.includes(i));
      let randomIndex = remaining[Math.floor(Math.random() * remaining.length)];
      drawnArray.push(randomIndex);
      return deck[randomIndex];
    }

    function displayCardOnPage(card, type) {
      const slotId = type === 'arc' ? "arcSlot" : "vibSlot";
      const imgId = type === 'arc' ? "arcImg" : "vibImg";
      const titleId = type === 'arc' ? "arcTitle" : "vibTitle";
      const descId = type === 'arc' ? "arcDesc" : "vibDesc";

      const slot = document.getElementById(slotId);
      slot.style.animation = 'none'; slot.offsetHeight; slot.style.animation = null;
      slot.style.display = "block";
      document.getElementById(imgId).src = card.image;
      document.getElementById(titleId).textContent = card.name;
      document.getElementById(descId).textContent = card.description;
      
      addToHistory(card);
    }

    function addToHistory(card) {
      const now = new Date();
      const dateKey = now.toLocaleDateString('fr-FR', { day: 'numeric', month: 'long', year: 'numeric' });
      const timeStr = now.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });

      let dayGroup = document.querySelector(`[data-date="${dateKey}"]`);
      
      if (!dayGroup) {
        dayGroup = document.createElement("div");
        dayGroup.className = "history-day-group";
        dayGroup.setAttribute("data-date", dateKey);
        dayGroup.innerHTML = `<div class="history-date-header">Tirages du ${dateKey}</div><ul class="history-list"></ul>`;
        const container = document.getElementById("historyContainer");
        container.insertBefore(dayGroup, container.firstChild);
      }

      const list = dayGroup.querySelector(".history-list");
      const li = document.createElement("li");
      li.className = "history-item";
      li.innerHTML = `<span>${card.name}</span> <span class="time">${timeStr}</span>`;
      list.insertBefore(li, list.firstChild);
      
      localStorage.setItem("tirageHistoryStructured", document.getElementById("historyContainer").innerHTML);
    }

    document.getElementById("drawArc").addEventListener("click", () => displayCardOnPage(drawCard(arcCards, drawnArc), 'arc'));
    document.getElementById("drawVib").addEventListener("click", () => displayCardOnPage(drawCard(vibCards, drawnVib), 'vib'));

    document.getElementById("reshuffle").addEventListener("click", () => {
      if(confirm("Effacer tout l'historique ?")) {
        document.getElementById("historyContainer").innerHTML = "";
        document.getElementById("arcSlot").style.display = "none";
        document.getElementById("vibSlot").style.display = "none";
        localStorage.removeItem("tirageHistoryStructured");
      }
    });

    window.onload = function() {
      const saved = localStorage.getItem("tirageHistoryStructured");
      if(saved) document.getElementById("historyContainer").innerHTML = saved;
    };
  </script>
</body>
</html>
